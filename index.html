<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Remoto Samsung</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="conn">
  <input id="ip" placeholder="IP de la TV (ej. 192.168.1.50)" inputmode="decimal">
  <button id="btnConectar">Conectar</button>
</div>
<div id="estado">Desconectado</div>
<button id="cert">1️⃣ Autorizar conexión con la TV (solo la primera vez)</button>

<div class="fila c3">
  <button class="power" data-key="KEY_POWER">⏻</button>
  <button data-key="KEY_SOURCE">Fuente</button>
  <button data-key="KEY_MUTE">🔇</button>
</div>

<div class="dpad">
  <span></span><button data-key="KEY_UP">▲</button><span></span>
  <button data-key="KEY_LEFT">◀</button>
  <button class="ok-btn" data-key="KEY_ENTER">OK</button>
  <button data-key="KEY_RIGHT">▶</button>
  <span></span><button data-key="KEY_DOWN">▼</button><span></span>
</div>

<div class="fila c3">
  <button data-key="KEY_RETURN">⮌ Atrás</button>
  <button data-key="KEY_HOME">🏠 Inicio</button>
  <button data-key="KEY_MENU">☰ Menú</button>
</div>

<div class="vc">
  <div>
    <button data-key="KEY_VOLUP">VOL +</button>
    <button data-key="KEY_VOLDOWN">VOL −</button>
  </div>
  <div>
    <button data-key="KEY_CHUP">CH +</button>
    <button data-key="KEY_CHDOWN">CH −</button>
  </div>
</div>

<div class="fila c3">
  <button data-key="KEY_1">1</button><button data-key="KEY_2">2</button><button data-key="KEY_3">3</button>
  <button data-key="KEY_4">4</button><button data-key="KEY_5">5</button><button data-key="KEY_6">6</button>
  <button data-key="KEY_7">7</button><button data-key="KEY_8">8</button><button data-key="KEY_9">9</button>
  <button data-key="KEY_INFO">Info</button><button data-key="KEY_0">0</button><button data-key="KEY_GUIDE">Guía</button>
</div>

<div class="fila c4">
  <button data-key="KEY_REWIND">⏪</button>
  <button data-key="KEY_PLAY">▶</button>
  <button data-key="KEY_PAUSE">⏸</button>
  <button data-key="KEY_FF">⏩</button>
</div>

<small>La TV y el teléfono deben estar en la misma red Wi-Fi.</small>

<script src="app.js"></script>
</body>
</html>
